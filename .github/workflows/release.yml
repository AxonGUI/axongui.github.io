name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client:
    name: 客户端 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AxonDocs-windows-x64.zip
          - os: ubuntu-22.04
            artifact: AxonDocs-linux-x64.tar.gz
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装 Qt 运行库（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbfile1 libxkbcommon0 libdbus-1-3 libfontconfig1 libnss3 \
            libglib2.0-0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxshmfence1
      - name: 装 Python 依赖
        run: |
          python -m pip install -U pip
          python -m pip install "axon-gui>=5.4.0" "pyinstaller>=6.10"
      - name: 构建站点
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run docs:build
      - name: 打包客户端
        run: python scripts/build_client.py
      - name: 自检
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/client/dist/AxonDocs/AxonDocs.exe --smoke
          else
            ./build/client/dist/AxonDocs/AxonDocs --smoke
          fi
      - name: 压缩
        shell: bash
        run: |
          cd build/client/dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ github.workspace }}/${{ matrix.artifact }}" AxonDocs > /dev/null
          else
            tar -czf "${{ github.workspace }}/${{ matrix.artifact }}" AxonDocs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: 创建 GitHub Release
    needs: client
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          name: Axon 说明书客户端 ${{ github.ref_name }}
          body: |
            文档站的可交互客户端（自带 Python 运行时 + PySide6 + 站点构建产物，解压即用）。

            | 平台 | 文件 | 运行 |
            | --- | --- | --- |
            | Windows 10/11 x64 | `AxonDocs-windows-x64.zip` | 解压后双击 `AxonDocs\AxonDocs.exe` |
            | Linux x64 | `AxonDocs-linux-x64.tar.gz` | `tar -xzf …` 后跑 `AxonDocs/AxonDocs`（需 `libxkbfile1`） |

            自检：`AxonDocs --smoke`，退出码 0 = 通道连通且示例能跑。
